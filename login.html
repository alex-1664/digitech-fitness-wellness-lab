<!DOCTYPE html>
<html>
<head>
  <title>Digitech Fitness Admin Login</title>
  <style>
    body { font-family: Arial; background: #f4f6f9; display:flex; align-items:center; justify-content:center; height:100vh; }
    .login-container { background:white; padding:30px; border-radius:10px; box-shadow:0 0 10px rgba(0,0,0,0.2); width:300px; }
    input { width:100%; padding:10px; margin:10px 0; }
    button { width:100%; padding:12px; background:green; color:white; border:none; cursor:pointer; }
    .error { color:red; margin-top:10px; }
  </style>
</head>
<body>

<div class="login-container">
  <h2>Admin Login</h2>
  <input type="text" id="username" placeholder="Username">
  <input type="password" id="password" placeholder="Password">
  <button id="loginBtn">Login</button>
  <div class="error" id="errorMsg"></div>
</div>

<script src="login.js"></script>

</body>
</html>
