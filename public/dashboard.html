<!DOCTYPE html>
<html>
<head>

<title>Digitech Fitness Admin Dashboard</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<link rel="stylesheet" href="/css/style.css">

<style>

body{
font-family: Arial;
background:#f4f6f9;
margin:0;
}

.sidebar{
width:220px;
height:100vh;
background:#111;
color:white;
position:fixed;
padding:20px;
}

.sidebar h2{
color:#00ff99;
}

.sidebar a{
display:block;
color:white;
text-decoration:none;
margin:15px 0;
}

.main{
margin-left:240px;
padding:20px;
}

.cards{
display:flex;
gap:20px;
margin-bottom:30px;
}

.card{
background:white;
padding:20px;
border-radius:10px;
width:200px;
box-shadow:0 0 10px rgba(0,0,0,0.1);
}

.chart-box{
background:white;
padding:20px;
border-radius:10px;
margin-bottom:30px;
}

.ai-box{
background:white;
padding:20px;
border-radius:10px;
}

</style>

</head>

<body>

<div class="sidebar">

<h2>Digitech Fitness</h2>

<a href="/dashboard.html">Dashboard</a>
<a href="/members.html">Members</a>
<a href="/payments.html">Payments</a>
<a href="/attendance.html">Attendance</a>
<a href="/ai.html">AI Coach</a>
<a href="/logout">Logout</a>

</div>


<div class="main">

<h1>Admin Dashboard</h1>

<div class="cards">

<div class="card">
<h3>Total Members</h3>
<h2 id="membersCount">0</h2>
</div>

<div class="card">
<h3>Payments Today</h3>
<h2 id="paymentsToday">0</h2>
</div>

<div class="card">
<h3>Attendance Today</h3>
<h2 id="attendanceToday">0</h2>
</div>

</div>


<div class="chart-box">

<h3>Monthly Payments</h3>

<canvas id="paymentsChart"></canvas>

</div>


<div class="chart-box">

<h3>Daily Attendance</h3>

<canvas id="attendanceChart"></canvas>

</div>


<div class="ai-box">

<h3>Gym AI Coach</h3>

<input type="text" id="question" placeholder="Ask fitness question">

<button onclick="askAI()">Ask</button>

<p id="answer"></p>

</div>

</div>


<script>

fetch("/members")
.then(res=>res.json())
.then(data=>{
document.getElementById("membersCount").innerText=data.length
})

fetch("/payments/today")
.then(res=>res.json())
.then(data=>{
document.getElementById("paymentsToday").innerText=data.total
})

fetch("/attendance/today")
.then(res=>res.json())
.then(data=>{
document.getElementById("attendanceToday").innerText=data.total
})


const paymentsChart = new Chart(
document.getElementById("paymentsChart"),
{
type:"bar",
data:{
labels:["Jan","Feb","Mar","Apr","May","Jun"],
datasets:[{
label:"Payments (KSh)",
data:[12000,19000,8000,15000,20000,17000]
}]
}
}
)

const attendanceChart = new Chart(
document.getElementById("attendanceChart"),
{
type:"line",
data:{
labels:["Mon","Tue","Wed","Thu","Fri","Sat"],
datasets:[{
label:"Attendance",
data:[25,32,28,40,35,45]
}]
}
}
)

function askAI(){

const question = document.getElementById("question").value

fetch("/ai/ask",{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({question})

})
.then(res=>res.json())
.then(data=>{

document.getElementById("answer").innerText=data.answer

})

}

</script>

</body>
</html>
