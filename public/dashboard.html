<!-- ADD MEMBER MODAL (VERTICAL + PHOTO) -->
<div id="addModal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center">
  <div class="bg-white p-6 rounded w-full max-w-md overflow-y-auto max-h-[90vh]">

    <h2 class="text-xl font-bold mb-4 text-center">➕ Register Member</h2>

    <form id="addForm" class="flex flex-col gap-3">

      <input id="name" placeholder="Full Name" class="border p-3 rounded w-full" required>
      <input id="id" placeholder="ID Number" class="border p-3 rounded w-full" required>
      <input id="phone" placeholder="Phone Number" class="border p-3 rounded w-full" required>

      <input id="emergencyName" placeholder="Emergency Contact Name" class="border p-3 rounded w-full" required>
      <input id="emergencyPhone" placeholder="Emergency Contact Phone" class="border p-3 rounded w-full" required>

      <input id="weight" type="number" placeholder="Weight (kg)" class="border p-3 rounded w-full" required>

      <!-- ✅ NEW PHOTO FIELD -->
      <input id="photo" type="file" accept="image/*" class="border p-3 rounded w-full">

      <select id="plan" class="border p-3 rounded w-full">
        <option>Daily</option>
        <option>Weekly</option>
        <option>Monthly</option>
      </select>

      <input id="regFee" type="number" placeholder="Registration Fee" class="border p-3 rounded w-full">
      <input id="membershipFee" type="number" placeholder="Membership Fee" class="border p-3 rounded w-full">

      <div class="flex justify-between mt-3">
        <button type="button" onclick="closeAddModal()" class="bg-gray-400 px-4 py-2 rounded w-1/2 mr-2">Cancel</button>
        <button type="submit" class="bg-green-500 text-white px-4 py-2 rounded w-1/2">Save Member</button>
      </div>

    </form>
  </div>
</div>
