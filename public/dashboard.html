<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Digitech Gym Dashboard</title>

  <!-- Tailwind CSS -->
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@3.3.3/dist/tailwind.min.css" rel="stylesheet">

  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <!-- Axios -->
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>

  <!-- Custom CSS -->
  <link rel="stylesheet" href="css/style.css">

  <style>
    /* Sidebar toggle animation */
    #sidebar {
      transition: all 0.3s ease;
    }

    /* Table row hover animation */
    #membersBody tr {
      transition: all 0.3s ease;
      cursor: pointer;
    }

    #membersBody tr:hover {
      background-color: #f0f9ff;
      transform: scale(1.01);
    }
  </style>
</head>
<body class="flex h-screen bg-gray-100">

  <!-- Sidebar -->
  <aside id="sidebar" class="w-64 bg-white shadow-lg flex-shrink-0 transform transition-transform duration-300">
    <div class="p-6 flex justify-between items-center">
      <h1 class="text-2xl font-bold text-green-500">💪 Digitech Gym</h1>
      <button id="toggleSidebar" class="md:hidden text-gray-500 hover:text-gray-700">
        ☰
      </button>
    </div>
    <nav class="mt-6">
      <a href="#" class="block py-3 px-6 text-gray-700 hover:bg-green-100 rounded transition">Dashboard</a>
      <a href="#" class="block py-3 px-6 text-gray-700 hover:bg-green-100 rounded transition">Members</a>
      <a href="#" class="block py-3 px-6 text-gray-700 hover:bg-green-100 rounded transition">Payments</a>
      <a href="#" class="block py-3 px-6 text-gray-700 hover:bg-green-100 rounded transition">Reports</a>
      <a href="#" class="block py-3 px-6 text-gray-700 hover:bg-green-100 rounded transition">Settings</a>
    </nav>
  </aside>

  <!-- Main Content -->
  <div class="flex-1 overflow-auto p-6">

    <!-- Header -->
    <header class="flex justify-between items-center mb-6">
      <h2 class="text-3xl font-bold text-gray-700">Dashboard</h2>
      <div class="flex items-center gap-4">
        <button class="bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-600">Logout</button>
        <button id="toggleSidebarMobile" class="md:hidden bg-gray-200 p-2 rounded hover:bg-gray-300">☰</button>
      </div>
    </header>

    <!-- Summary Cards -->
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6 mb-8">
      <div class="bg-gradient-to-r from-green-400 to-blue-500 p-6 rounded-xl shadow-lg text-white transform transition hover:scale-105">
        <h2 class="text-gray-100">Total Members</h2>
        <p id="totalMembers" class="text-3xl font-bold mt-2">0</p>
      </div>
      <div class="bg-gradient-to-r from-purple-500 to-pink-500 p-6 rounded-xl shadow-lg text-white transform transition hover:scale-105">
        <h2 class="text-gray-100">Total Registration Fees</h2>
        <p id="totalRegFees" class="text-3xl font-bold mt-2">Ksh 0</p>
      </div>
      <div class="bg-gradient-to-r from-yellow-400 to-orange-500 p-6 rounded-xl shadow-lg text-white transform transition hover:scale-105">
        <h2 class="text-gray-100">Total Membership Fees</h2>
        <p id="totalMembershipFees" class="text-3xl font-bold mt-2">Ksh 0</p>
      </div>
    </div>

    <!-- Charts -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">
      <div class="bg-white p-6 rounded-xl shadow-lg">
        <h2 class="text-gray-500 mb-4 font-semibold">Members by Plan</h2>
        <canvas id="planChart"></canvas>
      </div>
      <div class="bg-white p-6 rounded-xl shadow-lg">
        <h2 class="text-gray-500 mb-4 font-semibold">Payments Overview</h2>
        <canvas id="paymentsChart"></canvas>
      </div>
    </div>

    <!-- Search & Export -->
    <div class="flex flex-col md:flex-row justify-between items-start md:items-center mb-4 gap-4">
      <input type="text" id="searchInput" placeholder="Search by Name, ID, Phone" class="p-2 border rounded w-full md:w-1/3">
      <select id="planFilter" class="p-2 border rounded">
        <option value="">All Plans</option>
        <option value="Daily">Daily</option>
        <option value="Weekly">Weekly</option>
        <option value="Monthly">Monthly</option>
      </select>
      <div class="flex gap-2">
        <button onclick="exportCSV()" class="bg-green-500 text-white px-3 py-1 rounded hover:bg-green-600">CSV</button>
        <button onclick="exportPDF()" class="bg-blue-500 text-white px-3 py-1 rounded hover:bg-blue-600">PDF</button>
      </div>
    </div>

    <!-- Member Table -->
    <div class="bg-white p-4 rounded-xl shadow-lg overflow-x-auto">
      <table class="min-w-full divide-y divide-gray-200" id="membersTable">
        <thead class="bg-gray-100">
          <tr>
            <th class="px-4 py-2">Name</th>
            <th class="px-4 py-2">ID</th>
            <th class="px-4 py-2">Phone</th>
            <th class="px-4 py-2">Plan</th>
            <th class="px-4 py-2">Reg Fee</th>
            <th class="px-4 py-2">Membership Fee</th>
            <th class="px-4 py-2">Reg Date</th>
            <th class="px-4 py-2">Actions</th>
          </tr>
        </thead>
        <tbody id="membersBody" class="bg-white divide-y divide-gray-200 transition-all duration-300">
          <!-- Rows dynamically injected -->
        </tbody>
      </table>
    </div>

  </div>

  <!-- Sidebar Toggle Script -->
  <script>
    const sidebar = document.getElementById('sidebar');
    const toggleSidebar = document.getElementById('toggleSidebar');
    const toggleSidebarMobile = document.getElementById('toggleSidebarMobile');

    function toggle() {
      sidebar.classList.toggle('-translate-x-full');
    }

    toggleSidebar.addEventListener('click', toggle);
    toggleSidebarMobile.addEventListener('click', toggle);
  </script>

  <script src="dashboard.js"></script>
</body>
</html>
