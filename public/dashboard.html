<!DOCTYPE html>
<html>
<head>
  <title>Dashboard</title>

  <!-- LOGIN PROTECTION -->
  <script>
    if(localStorage.getItem("isLoggedIn") !== "true"){
      window.location.href = "login.html";
    }
  </script>

  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@3.3.3/dist/tailwind.min.css" rel="stylesheet">
</head>

<body class="bg-gray-100 p-4">

<div class="flex justify-between mb-4">
  <h1 class="text-2xl font-bold">💪 Gym Dashboard</h1>
  <button onclick="logout()" class="bg-red-500 text-white px-3 py-1 rounded">Logout</button>
</div>

<!-- ADD FORM -->
<div class="bg-white p-4 rounded shadow mb-4">
  <form id="addMemberForm" class="grid grid-cols-2 gap-2">

    <input id="memberName" placeholder="Name" class="p-2 border">
    <input id="memberID" placeholder="ID" class="p-2 border">
    <input id="memberPhone" placeholder="Phone" class="p-2 border">

    <select id="memberGender" class="p-2 border">
      <option>Male</option>
      <option>Female</option>
    </select>

    <select id="memberPlan" class="p-2 border">
      <option>Daily</option>
      <option>Weekly</option>
      <option>Monthly</option>
    </select>

    <input id="memberRegFee" type="number" placeholder="Reg Fee" class="p-2 border">
    <input id="memberMembershipFee" type="number" placeholder="Membership Fee" class="p-2 border">
    <input id="memberRegDate" type="date" class="p-2 border">

    <input id="emergencyName" placeholder="Emergency Name" class="p-2 border">
    <input id="emergencyPhone" placeholder="Emergency Phone" class="p-2 border">

    <input id="memberWeight" type="number" placeholder="Weight (kg)" class="p-2 border">

    <button class="bg-green-500 text-white col-span-2 py-2">Add Member</button>
  </form>
</div>

<!-- TABLE -->
<div class="bg-white p-4 rounded shadow">
  <table class="w-full border">
    <thead class="bg-gray-200">
      <tr>
        <th>Name</th>
        <th>ID</th>
        <th>Phone</th>
        <th>Gender</th>
        <th>Plan</th>
        <th>Weight</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody id="membersBody"></tbody>
  </table>
</div>

<script src="dashboard.js"></script>

</body>
</html>
