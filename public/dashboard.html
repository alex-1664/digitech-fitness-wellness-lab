<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Digitech Gym Dashboard</title>

  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@3.3.3/dist/tailwind.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link rel="stylesheet" href="css/style.css">
</head>

<body class="flex h-screen bg-gray-100">

<!-- SIDEBAR -->
<aside class="w-64 bg-white shadow-lg p-4">
  <h1 class="text-2xl font-bold text-green-500 mb-6">💪 Digitech Gym</h1>
  <nav>
    <a href="#" class="block py-2 px-4 bg-green-100 rounded font-bold">Dashboard</a>
  </nav>
</aside>

<!-- MAIN -->
<div class="flex-1 p-6 overflow-auto">

  <!-- HEADER -->
  <h2 class="text-3xl font-bold mb-6">Dashboard</h2>

  <!-- CARDS -->
  <div class="grid grid-cols-3 gap-4 mb-6">
    <div class="bg-green-400 text-white p-4 rounded">
      Total Members: <span id="totalMembers">0</span>
    </div>
    <div class="bg-purple-400 text-white p-4 rounded">
      Reg Fees: <span id="totalRegFees">0</span>
    </div>
    <div class="bg-yellow-400 text-white p-4 rounded">
      Membership: <span id="totalMembershipFees">0</span>
    </div>
  </div>

  <!-- TABLE -->
  <div class="bg-white p-4 rounded shadow overflow-x-auto">
    <table class="min-w-full">
      <thead class="bg-gray-200">
        <tr>
          <th>Name</th>
          <th>ID</th>
          <th>Phone</th>
          <th>Gender</th>
          <th>Plan</th>
          <th>Reg Fee</th>
          <th>Membership</th>
          <th>Date</th>
          <th>Emergency Name</th>
          <th>Emergency Phone</th>
          <th>Weight</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="membersBody"></tbody>
    </table>
  </div>

  <!-- ADD BUTTON -->
  <div class="mt-4 text-right">
    <button id="openAddModal" class="bg-green-500 text-white px-4 py-2 rounded">+ Add Member</button>
  </div>

</div>

<!-- ================= ADD MODAL ================= -->
<div id="addModal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex justify-center items-center">
  <div class="bg-white p-6 rounded w-full max-w-md">
    <h2 class="text-xl font-bold mb-4">Add Member</h2>

    <form id="addMemberForm" class="flex flex-col gap-2">

      <input id="memberName" placeholder="Name" class="p-2 border rounded" required>
      <input id="memberID" placeholder="ID" class="p-2 border rounded" required>
      <input id="memberPhone" placeholder="Phone" class="p-2 border rounded" required>

      <select id="memberGender" class="p-2 border rounded" required>
        <option value="">Gender</option>
        <option>Male</option>
        <option>Female</option>
      </select>

      <select id="memberPlan" class="p-2 border rounded">
        <option>Daily</option>
        <option>Weekly</option>
        <option>Monthly</option>
      </select>

      <input id="memberRegFee" type="number" placeholder="Reg Fee" class="p-2 border rounded">
      <input id="memberMembershipFee" type="number" placeholder="Membership Fee" class="p-2 border rounded">
      <input id="memberRegDate" type="date" class="p-2 border rounded">

      <!-- NEW FIELDS -->
      <input id="emergencyName" placeholder="Emergency Contact Name" class="p-2 border rounded">
      <input id="emergencyPhone" placeholder="Emergency Contact Phone" class="p-2 border rounded">
      <input id="memberWeight" type="number" placeholder="Weight (kg)" class="p-2 border rounded">

      <div class="flex justify-end gap-2 mt-2">
        <button type="button" id="closeAddModal" class="bg-gray-300 px-3 py-1 rounded">Cancel</button>
        <button class="bg-green-500 text-white px-3 py-1 rounded">Save</button>
      </div>
    </form>
  </div>
</div>

<!-- ================= EDIT MODAL ================= -->
<div id="editModal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex justify-center items-center">
  <div class="bg-white p-6 rounded w-full max-w-md">
    <h2 class="text-xl font-bold mb-4">Edit Member</h2>

    <form id="editMemberForm" class="flex flex-col gap-2">

      <input id="editMemberName" class="p-2 border rounded">
      <input id="editMemberID" class="p-2 border rounded">
      <input id="editMemberPhone" class="p-2 border rounded">

      <select id="editMemberGender" class="p-2 border rounded">
        <option>Male</option>
        <option>Female</option>
      </select>

      <select id="editMemberPlan" class="p-2 border rounded">
        <option>Daily</option>
        <option>Weekly</option>
        <option>Monthly</option>
      </select>

      <input id="editMemberRegFee" type="number" class="p-2 border rounded">
      <input id="editMemberMembershipFee" type="number" class="p-2 border rounded">
      <input id="editMemberRegDate" type="date" class="p-2 border rounded">

      <!-- NEW -->
      <input id="editEmergencyName" class="p-2 border rounded">
      <input id="editEmergencyPhone" class="p-2 border rounded">

      <div class="flex justify-end gap-2 mt-2">
        <button type="button" id="closeEditModal" class="bg-gray-300 px-3 py-1 rounded">Cancel</button>
        <button class="bg-blue-500 text-white px-3 py-1 rounded">Save</button>
      </div>
    </form>
  </div>
</div>

<!-- ================= WEIGHT MODAL ================= -->
<div id="weightModal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center hidden">
  <div class="bg-white p-6 rounded-xl w-full max-w-md">
    <h2 class="text-xl font-bold mb-4">Update Weight</h2>

    <form id="weightForm" class="flex flex-col gap-3">
      <input type="date" id="weightDate" class="p-2 border rounded" required>
      <input type="number" id="newWeight" placeholder="Weight (kg)" class="p-2 border rounded" required>

      <div class="flex justify-end gap-2">
        <button type="button" id="closeWeightModal" class="bg-gray-300 px-4 py-2 rounded">Cancel</button>
        <button type="submit" class="bg-green-500 text-white px-4 py-2 rounded">Save</button>
      </div>
    </form>
  </div>
</div>

<script src="dashboard.js"></script>

</body>
</html>
