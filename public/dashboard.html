<!DOCTYPE html>
<html>
<head>
<title>Dashboard</title>
<style>
body{ font-family: Arial; background:#f4f4f4; }
.container{ width:90%; margin:auto; }
.cards{ display:grid; grid-template-columns: repeat(4,1fr); gap:20px; margin-top:40px; }
.card{ background:white; padding:20px; border-radius:10px; text-align:center; box-shadow:0 0 8px rgba(0,0,0,0.2); }
.number{ font-size:30px; font-weight:bold; margin-top:10px; }
</style>
</head>
<body>
<div class="container">
<h1>Digitech Fitness Dashboard</h1>
<div class="cards">
<div class="card"><h3>Total Members</h3><div id="members" class="number">0</div></div>
<div class="card"><h3>Today Check-ins</h3><div id="checkins" class="number">0</div></div>
<div class="card"><h3>Monthly Revenue</h3><div id="revenue" class="number">0</div></div>
<div class="card"><h3>Expiring Soon</h3><div id="expiry" class="number">0</div></div>
</div>
</div>
<script>
fetch("/api/dashboard")
.then(res=>res.json())
.then(data=>{
  document.getElementById("members").innerText = data.members;
  document.getElementById("checkins").innerText = data.checkins;
  document.getElementById("revenue").innerText = "KES " + data.revenue;
  document.getElementById("expiry").innerText = data.expiring;
});
</script>
</body>
</html>
