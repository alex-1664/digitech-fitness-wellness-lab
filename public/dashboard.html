<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="cache-control" content="no-cache, no-store, must-revalidate" />
<meta http-equiv="pragma" content="no-cache" />
<meta http-equiv="expires" content="0" />
<title>Digitech Gym Dashboard</title>
<link href="https://cdn.jsdelivr.net/npm/tailwindcss@3.3.3/dist/tailwind.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>

<style>
/* Table row hover animation */
#membersBody tr { transition: all 0.3s ease; }
#membersBody tr:hover { background-color: #f0f9ff; transform: scale(1.01); }
/* Modal styling */
.modal { display: none; position: fixed; inset:0; background: rgba(0,0,0,0.5); justify-content:center; align-items:center; }
.modal-content { background:white; padding:20px; border-radius:10px; max-width:400px; width:90%; }
</style>

<script>
// ===== LOGIN PROTECTION =====
if(localStorage.getItem("token") !== "loggedin"){ window.location.href = "login.html"; }
</script>

</head>
<body class="bg-gray-100">

<div class="container mx-auto p-4">

  <div class="flex justify-between items-center mb-6">
    <h1 class="text-3xl font-bold text-gradient bg-clip-text text-transparent bg-gradient-to-r from-green-400 to-blue-500">
      💪 Digitech Gym Dashboard
    </h1>
    <button onclick="logout()" class="bg-red-500 text-white px-3 py-1 rounded">Logout</button>
  </div>

  <!-- Summary Cards -->
  <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6 mb-8">
    <div class="bg-gradient-to-r from-green-400 to-blue-500 p-6 rounded-xl shadow-lg text-white transform transition hover:scale-105">
      <h2 class="text-gray-100">Total Members</h2>
      <p id="totalMembers" class="text-3xl font-bold mt-2">0</p>
    </div>
    <div class="bg-gradient-to-r from-purple-500 to-pink-500 p-6 rounded-xl shadow-lg text-white transform transition hover:scale-105">
      <h2 class="text-gray-100">Total Registration Fees</h2>
      <p id="totalRegFees" class="text-3xl font-bold mt-2">Ksh 0</p>
    </div>
    <div class="bg-gradient-to-r from-yellow-400 to-orange-500 p-6 rounded-xl shadow-lg text-white transform transition hover:scale-105">
      <h2 class="text-gray-100">Total Membership Fees</h2>
      <p id="totalMembershipFees" class="text-3xl font-bold mt-2">Ksh 0</p>
    </div>
  </div>

  <!-- Charts -->
  <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">
    <div class="bg-white p-6 rounded-xl shadow-lg">
      <h2 class="text-gray-500 mb-4 font-semibold">Members by Plan</h2>
      <canvas id="planChart"></canvas>
    </div>
    <div class="bg-white p-6 rounded-xl shadow-lg">
      <h2 class="text-gray-500 mb-4 font-semibold">Weight Progress</h2>
      <canvas id="paymentsChart"></canvas>
    </div>
  </div>

  <!-- Add Member Button -->
  <div class="mb-4">
    <button id="openAddModal" class="bg-green-500 text-white px-4 py-2 rounded hover:bg-green-600">Add Member</button>
  </div>

  <!-- Member Table -->
  <div class="bg-white p-4 rounded-xl shadow-lg overflow-x-auto">
    <table class="min-w-full divide-y divide-gray-200" id="membersTable">
      <thead class="bg-gray-100">
        <tr>
          <th class="px-4 py-2">Name</th>
          <th class="px-4 py-2">ID</th>
          <th class="px-4 py-2">Phone</th>
          <th class="px-4 py-2">Gender</th>
          <th class="px-4 py-2">Plan</th>
          <th class="px-4 py-2">Reg Fee</th>
          <th class="px-4 py-2">Membership Fee</th>
          <th class="px-4 py-2">Reg Date</th>
          <th class="px-4 py-2">Emergency Name</th>
          <th class="px-4 py-2">Emergency Phone</th>
          <th class="px-4 py-2">Weight</th>
          <th class="px-4 py-2">Actions</th>
        </tr>
      </thead>
      <tbody id="membersBody" class="bg-white divide-y divide-gray-200"></tbody>
    </table>
  </div>

</div>

<!-- ========== MODALS ========== -->
<!-- Add Member Modal -->
<div id="addModal" class="modal">
  <div class="modal-content">
    <h2 class="text-xl font-bold mb-4">Add Member</h2>
    <form id="addMemberForm" class="flex flex-col gap-2">
      <input id="memberName" placeholder="Full Name" required>
      <input id="memberID" placeholder="ID Number" required>
      <input id="memberPhone" placeholder="Phone Number" required>
      <select id="memberGender">
        <option>Male</option>
        <option>Female</option>
      </select>
      <select id="memberPlan">
        <option>Daily</option>
        <option>Weekly</option>
        <option>Monthly</option>
      </select>
      <input id="memberRegFee" placeholder="Registration Fee" type="number" required>
      <input id="memberMembershipFee" placeholder="Membership Fee" type="number" required>
      <input id="memberRegDate" type="date" required>
      <input id="emergencyName" placeholder="Emergency Contact Name" required>
      <input id="emergencyPhone" placeholder="Emergency Contact Phone" required>
      <input id="memberWeight" placeholder="Weight (kg)" type="number" required>
      <div class="flex justify-end gap-2 mt-2">
        <button type="button" id="closeAddModal" class="bg-gray-300 px-4 py-2 rounded">Cancel</button>
        <button type="submit" class="bg-green-500 text-white px-4 py-2 rounded">Add</button>
      </div>
    </form>
  </div>
</div>

<!-- Weight Modal -->
<div id="weightModal" class="modal">
  <div class="modal-content">
    <h2 class="text-xl font-bold mb-4">Update Weight</h2>
    <form id="weightForm" class="flex flex-col gap-2">
      <input type="date" id="weightDate" required>
      <input type="number" id="newWeight" placeholder="Weight (kg)" required>
      <div class="flex justify-end gap-2 mt-2">
        <button type="button" id="closeWeightModal" class="bg-gray-300 px-4 py-2 rounded">Cancel</button>
        <button type="submit" class="bg-green-500 text-white px-4 py-2 rounded">Save</button>
      </div>
    </form>
  </div>
</div>

<script src="dashboard.js"></script>
<script>
function logout(){ localStorage.removeItem("token"); window.location.href="login.html"; }
</script>

</body>
</html>
