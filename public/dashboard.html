<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta http-equiv="cache-control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="pragma" content="no-cache">
<meta http-equiv="expires" content="0">

<title>Digitech Gym Dashboard</title>

<link href="https://cdn.jsdelivr.net/npm/tailwindcss@3.3.3/dist/tailwind.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://unpkg.com/@ericblade/quagga2/dist/quagga.min.js"></script>

<style>
  #membersBody tr { transition: all 0.3s ease; }
  #membersBody tr:hover { background-color: #f0f9ff; transform: scale(1.01); }

  /* Modal styles */
  #weightModal, #memberModal { position: fixed; inset: 0; background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; display: none; }
  .modal-content { background: white; padding: 20px; border-radius: 10px; width: 100%; max-width: 350px; }

</style>
</head>

<body class="bg-gray-100">

<div class="container mx-auto p-4">

<h1 class="text-3xl font-bold text-center mb-6 text-gradient bg-clip-text text-transparent bg-gradient-to-r from-green-400 to-blue-500">
💪 Digitech Gym Dashboard
</h1>

<!-- Summary Cards -->
<div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6 mb-8">
  <div class="bg-gradient-to-r from-green-400 to-blue-500 p-6 rounded-xl shadow-lg text-white transform transition hover:scale-105">
    <h2 class="text-gray-100">Total Members</h2>
    <p id="totalMembers" class="text-3xl font-bold mt-2">0</p>
  </div>
  <div class="bg-gradient-to-r from-purple-500 to-pink-500 p-6 rounded-xl shadow-lg text-white transform transition hover:scale-105">
    <h2 class="text-gray-100">Average Weight (kg)</h2>
    <p id="avgWeight" class="text-3xl font-bold mt-2">0</p>
  </div>
  <div class="bg-gradient-to-r from-yellow-400 to-orange-500 p-6 rounded-xl shadow-lg text-white transform transition hover:scale-105">
    <h2 class="text-gray-100">Attendance This Week</h2>
    <p id="weeklyAttendance" class="text-3xl font-bold mt-2">0%</p>
  </div>
</div>

<!-- Charts -->
<div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">
  <div class="bg-white p-6 rounded-xl shadow-lg">
    <h2 class="text-gray-500 mb-4 font-semibold">Weekly Weight Progress</h2>
    <canvas id="weightChart"></canvas>
  </div>
  <div class="bg-white p-6 rounded-xl shadow-lg">
    <h2 class="text-gray-500 mb-4 font-semibold">Weekly Attendance</h2>
    <canvas id="attendanceChart"></canvas>
  </div>
</div>

<!-- Member Table -->
<div class="bg-white p-4 rounded-xl shadow-lg overflow-x-auto mb-8">
  <table class="min-w-full divide-y divide-gray-200" id="membersTable">
    <thead class="bg-gray-100">
      <tr>
        <th class="px-4 py-2">Name</th>
        <th class="px-4 py-2">ID</th>
        <th class="px-4 py-2">Phone</th>
        <th class="px-4 py-2">Plan</th>
        <th class="px-4 py-2">Reg Fee</th>
        <th class="px-4 py-2">Membership Fee</th>
        <th class="px-4 py-2">Reg Date</th>
        <th class="px-4 py-2">Emergency Name</th>
        <th class="px-4 py-2">Emergency Phone</th>
        <th class="px-4 py-2">Weight (kg)</th>
        <th class="px-4 py-2">Actions</th>
      </tr>
    </thead>
    <tbody id="membersBody"></tbody>
  </table>
</div>

<!-- Weight Modal -->
<div id="weightModal">
  <div class="modal-content">
    <h2 class="text-xl font-bold mb-4">Update Weight</h2>
    <form id="weightForm" class="flex flex-col gap-3">
      <input type="date" id="weightDate" class="p-2 border rounded" required>
      <input type="number" id="newWeight" placeholder="Weight (kg)" class="p-2 border rounded" required>
      <div class="flex justify-end gap-2">
        <button type="button" id="closeWeightModal" class="bg-gray-300 px-4 py-2 rounded">Cancel</button>
        <button type="submit" class="bg-green-500 text-white px-4 py-2 rounded">Save</button>
      </div>
    </form>
  </div>
</div>

<!-- Member Info Modal -->
<div id="memberModal">
  <div class="modal-content">
    <h2 class="text-xl font-bold mb-4">Member Info</h2>
    <p><strong>Name:</strong> <span id="modalName"></span></p>
    <p><strong>ID:</strong> <span id="modalId"></span></p>
    <p><strong>Plan:</strong> <span id="modalPlan"></span></p>
    <p><strong>Status:</strong> <span id="modalStatus"></span></p>
    <div class="flex justify-end mt-4">
      <button id="closeMemberModal" class="bg-gray-300 px-4 py-2 rounded">Close</button>
    </div>
  </div>
</div>

<!-- Beep sound -->
<audio id="beepSound" src="https://www.soundjay.com/button/beep-07.wav" preload="auto"></audio>

<script src="dashboard.js"></script>
<script src="attendance.js"></script>
</div>
</body>
</html>
