<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Digitech Gym Dashboard</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
  <!-- Sidebar -->
  <div class="sidebar">
    <a href="dashboard.html" class="sidebar-link">Dashboard</a>
    <a href="index.html" class="sidebar-link">Register Member</a>
    <a href="attendance.html" class="sidebar-link">Attendance</a>
    <a href="#" onclick="logout()">Logout</a>
  </div>

  <!-- Main Content -->
  <div class="main">
    <h1>💪 Digitech Fitness Dashboard</h1>

    <div class="summary-cards">
      <div>Total Members: <span id="totalMembers">0</span></div>
      <div>Total Registration Fees: <span id="totalRegFees">Ksh 0</span></div>
      <div>Total Membership Fees: <span id="totalMembershipFees">Ksh 0</span></div>
    </div>

    <canvas id="planChart" height="200"></canvas>

    <table id="membersTable">
      <thead>
        <tr>
          <th>Name</th><th>ID</th><th>Phone</th><th>Plan</th><th>Reg Fee</th>
          <th>Membership Fee</th><th>Reg Date</th><th>Emergency Name</th><th>Emergency Phone</th><th>Weight</th>
        </tr>
      </thead>
      <tbody id="membersBody"></tbody>
    </table>
  </div>

  <script src="js/dashboard.js"></script>
</body>
</html>
