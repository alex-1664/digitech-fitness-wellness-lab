<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Register Member</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="container">
    <h2>🏋️ Register Member</h2>
    <form id="memberForm">
      <input type="text" id="name" placeholder="Full Name" required>
      <input type="text" id="id" placeholder="ID Number" required>
      <input type="text" id="phone" placeholder="Phone Number" required>
      <input type="text" id="emergencyName" placeholder="Emergency Contact Name" required>
      <input type="text" id="emergencyPhone" placeholder="Emergency Contact Phone" required>
      <input type="number" id="weight" placeholder="Weight (kg)" required>
      <select id="plan">
        <option>Daily</option><option>Weekly</option><option>Monthly</option>
      </select>
      <input type="number" id="regFee" placeholder="Registration Fee">
      <input type="number" id="amount" placeholder="Amount Paid">
      <button type="submit">Add Member</button>
    </form>
  </div>
  <script src="js/index.js"></script>
</body>
</html>
