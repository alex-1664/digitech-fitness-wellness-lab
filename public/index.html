<!DOCTYPE html>
<html>
<head>
    <title>Digitech Fitness</title>
    <style>
        body { font-family: Arial; background: #f4f6f9; }
        .container {
            max-width: 600px;
            margin: auto;
            background: white;
            padding: 20px;
            border-radius: 10px;
        }
        input, select {
            width: 100%;
            padding: 10px;
            margin: 6px 0;
        }
        button {
            width: 100%;
            padding: 12px;
            background: green;
            color: white;
            border: none;
        }
        .member {
            background: #eee;
            margin: 10px 0;
            padding: 10px;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>🏋️ Digitech Fitness Registration</h2>

    <input id="name" placeholder="Full Name">
    <input id="id" placeholder="ID Number">
    <input id="phone" placeholder="Phone Number">
    <input id="emergencyPhone" placeholder="Emergency Contact Phone">
    <input id="weight" placeholder="Weight (kg)">

    <select id="plan">
        <option>Daily</option>
        <option>Weekly</option>
        <option>Monthly</option>
    </select>

    <input id="regFee" placeholder="Registration Fee">
    <input id="amount" placeholder="Amount Paid">

    <button onclick="addMember()">Add Member</button>
</div>

<div class="container">
    <h3>Members</h3>
    <div id="members"></div>
</div>

<script>
async function addMember() {
    const member = {
        name: document.getElementById("name").value,
        id: document.getElementById("id").value,
        phone: document.getElementById("phone").value,
        emergencyPhone: document.getElementById("emergencyPhone").value,
        weight: document.getElementById("weight").value,
        plan: document.getElementById("plan").value,
        regFee: document.getElementById("regFee").value,
        amount: document.getElementById("amount").value
    }

    await fetch("/add-member", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(member)
    })

    loadMembers()
}

async function loadMembers() {
    const res = await fetch("/members")
    const data = await res.json()

    const list = document.getElementById("members")
    list.innerHTML = ""

    data.forEach(m => {
        list.innerHTML += `
            <div class="member">
                <b>${m.name}</b><br>
                ID: ${m.id}<br>
                Phone: ${m.phone}<br>
                Weight: ${m.weight} kg<br>
                Plan: ${m.plan}<br>
                Paid: KES ${m.amount}
            </div>
        `
    })
}

loadMembers()
</script>

</body>
</html>
