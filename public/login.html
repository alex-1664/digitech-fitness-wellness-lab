<!DOCTYPE html>
<html>
<head>
  <!-- 🔥 Prevent Browser Cache -->
  <meta http-equiv="cache-control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="pragma" content="no-cache" />
  <meta http-equiv="expires" content="0" />

  <title>Login</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@3.3.3/dist/tailwind.min.css" rel="stylesheet">
</head>

<body class="flex items-center justify-center h-screen bg-gray-100">

<div class="bg-white p-6 rounded shadow w-80">
  <h2 class="text-xl font-bold mb-4 text-center">Admin Login</h2>

  <form id="loginForm" class="flex flex-col gap-3">
    <input id="username" placeholder="Username" class="p-2 border rounded">
    <input id="password" type="password" placeholder="Password" class="p-2 border rounded">

    <button class="bg-green-500 text-white py-2 rounded">Login</button>
  </form>

  <p id="error" class="text-red-500 hidden mt-2">Wrong login</p>
</div>

<script>
document.getElementById('loginForm').onsubmit = function(e){
  e.preventDefault();
  const u = username.value;
  const p = password.value;

  if(u === "admin" && p === "1234"){
    localStorage.setItem("isLoggedIn","true");
    window.location.href = "dashboard.html";
  } else {
    error.classList.remove("hidden");
  }
}
</script>

</body>
</html>
