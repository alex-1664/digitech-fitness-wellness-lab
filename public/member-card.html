<!DOCTYPE html>
<html>
<head>
<title>Member Card</title>
<style>
body{font-family:Arial;text-align:center;background:#eee;}
.card{
  width:300px;
  margin:auto;
  padding:20px;
  background:white;
  border-radius:10px;
  box-shadow:0 0 10px rgba(0,0,0,0.3);
}
img{width:100px;height:100px;border-radius:50%;}
</style>
</head>
<body>

<div class="card">
  <h2>DIGITECH FITNESS</h2>
  <img id="photo">
  <h3 id="name"></h3>
  <p>ID: <span id="id"></span></p>
  <p>Plan: <span id="plan"></span></p>
</div>

<script>
const id = new URLSearchParams(location.search).get("id");
const members = JSON.parse(localStorage.getItem("members")) || [];

const m = members.find(x=>x.id===id);

if(m){
  document.getElementById("name").innerText = m.name;
  document.getElementById("id").innerText = m.id;
  document.getElementById("plan").innerText = m.plan;
  document.getElementById("photo").src = m.photo || "";
}
</script>

</body>
</html>
