<!DOCTYPE html>
<html>
<head>
<title>Member Card</title>
<style>
body{ font-family: Arial; text-align:center; background:#f4f4f4; }
.card{ width:320px; margin:auto; padding:20px; background:white; border-radius:10px; box-shadow:0 0 10px rgba(0,0,0,0.2); }
.photo{ width:100px; height:100px; border-radius:50%; object-fit:cover; }
.qr{ margin-top:10px; }
</style>
</head>
<body>
<div class="card">
<h2>DIGITECH FITNESS</h2>
<img id="photo" class="photo" src="" />
<h3 id="name"></h3>
<p>ID: <span id="memberId"></span></p>
<p>Expires: <span id="expiry"></span></p>
<img id="qr" class="qr" width="150"/>
</div>

<script>
const params = new URLSearchParams(window.location.search);
const memberId = params.get("id");
fetch("/api/members/" + memberId)
.then(res => res.json())
.then(member => {
  document.getElementById("name").innerText = member.name;
  document.getElementById("memberId").innerText = member.memberId;
  document.getElementById("expiry").innerText = member.expiry;
  document.getElementById("photo").src = member.photo;
  document.getElementById("qr").src = member.qrCode;
});
</script>
</body>
</html>
