<!DOCTYPE html>
<html>
<head>
<title>QR Check-In</title>
<script src="https://unpkg.com/html5-qrcode"></script>
</head>
<body>
<h2>QR Check-In</h2>
<div id="reader" style="width:300px;margin:auto;"></div>
<div id="result"></div>
<button onclick="startScanner()">Start Scanner</button>

<script>
function startScanner(){
  const scanner = new Html5Qrcode("reader")
  scanner.start(
    { facingMode: "environment" },
    { fps:10, qrbox:250 },
    function(decodedText){
      document.getElementById("result").innerText = "QR: " + decodedText
      fetch("/attendance/checkin",{
        method:"POST",
        headers: {"Content-Type":"application/json"},
        body: JSON.stringify({ memberId: decodedText })
      }).then(res=>res.json()).then(data=>{
        document.getElementById("result").innerText = data.success ? `✅ ${data.name} Checked-In` : "❌ Member not found"
      })
      scanner.stop()
    },
    function(err){ console.log(err) }
  )
}
</script>
</body>
</html>
