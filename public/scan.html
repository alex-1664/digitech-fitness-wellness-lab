<script>

let scanner

function startScanner(){

  scanner = new Html5Qrcode("reader")

  scanner.start(
    { facingMode: "environment" },
    { fps:10, qrbox:250 },

    function(decodedText){

      // Extract member ID
      let memberId = decodedText.includes(":")
        ? decodedText.split(":")[1]
        : decodedText

      document.getElementById("result").innerText =
        "Scanning member: " + memberId

      fetch("/attendance/checkin",{
        method:"POST",
        headers: {"Content-Type":"application/json"},
        body: JSON.stringify({ memberId: memberId })
      })
      .then(res=>res.json())
      .then(data=>{

        document.getElementById("result").innerText =
          data.success
          ? "✅ " + data.name + " Checked-In"
          : "❌ Member not found"

      })

    },

    function(err){
      console.log(err)
    }

  )
}

</script>
