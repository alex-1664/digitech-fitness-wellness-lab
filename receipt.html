<!DOCTYPE html>
<html>

<head>

<title>Digitech Fitness Receipt</title>

<style>

body{
font-family: Arial;
width:105mm;
height:148mm;
padding:10px;
border:1px solid #000;
}

.logo{
text-align:center;
}

.logo img{
width:60px;
}

h2{
text-align:center;
margin:5px;
}

.motto{
text-align:center;
font-style:italic;
font-size:12px;
}

hr{
margin:10px 0;
}

table{
width:100%;
font-size:14px;
}

td{
padding:4px;
}

.footer{
text-align:center;
margin-top:10px;
font-size:12px;
}

</style>

</head>

<body>

<div class="logo">
<img src="logo.png">
</div>

<h2>Digitech Fitness & Wellness Lab</h2>

<p class="motto">
Where Sweat Writes Success<br>
Grind • Grow • Glow
</p>

<hr>

<table>

<tr>
<td>Receipt No:</td>
<td id="receipt"></td>
</tr>

<tr>
<td>Member Name:</td>
<td id="name"></td>
</tr>

<tr>
<td>Phone:</td>
<td id="phone"></td>
</tr>

<tr>
<td>Payment Type:</td>
<td id="plan"></td>
</tr>

<tr>
<td>Amount Paid:</td>
<td id="amount"></td>
</tr>

<tr>
<td>Date:</td>
<td id="date"></td>
</tr>

<tr>
<td>MPESA Code:</td>
<td id="mpesa"></td>
</tr>

</table>

<hr>

<div class="footer">

Thank you for choosing Digitech Fitness 💪

</div>

</body>

</html>
