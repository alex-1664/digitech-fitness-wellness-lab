<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.9.2/html2pdf.bundle.min.js"></script>
<script>
// ======= Auto-fill receipt data =======
function generateReceipt(data){
    document.getElementById("receipt").innerText = data.receipt;
    document.getElementById("name").innerText = data.name;
    document.getElementById("phone").innerText = data.phone;
    document.getElementById("plan").innerText = data.plan;
    document.getElementById("amount").innerText = "KSh " + data.amount;
    document.getElementById("date").innerText = new Date().toLocaleDateString();
    document.getElementById("mpesa").innerText = data.mpesa;
}

// Example: fill in receipt after payment
generateReceipt({
    receipt: "DG2451",
    name: "John Mwangi",
    phone: "0712345678",
    plan: "Monthly Membership",
    amount: "2000",
    mpesa: "QWE45RT6"
});

// ======= Download PDF Function =======
function downloadReceipt(){
    const element = document.getElementById("receipt-container"); // your receipt div
    const options = {
        margin: 0.5,
        filename: 'digitech-receipt.pdf',
        image: { type: 'jpeg', quality: 0.98 },
        html2canvas: { scale: 2 },
        jsPDF: { unit: 'mm', format: 'a6', orientation: 'portrait' }
    };
    html2pdf().from(element).set(options).save();
}

// Optional: you can automatically download receipt after payment
// downloadReceipt(); // uncomment this line to auto-download
</script>
